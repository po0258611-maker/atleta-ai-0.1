name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: storied-cable-xn50x
      FIRESTORE_ALLOW_MEMORY_FALLBACK: false
      PAYMENT_MODE: mock
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Detect case-insensitive path collisions
        shell: bash
        run: |
          set -euo pipefail
          collisions=$(git ls-tree -r --name-only HEAD | awk '{print tolower($0)}' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "Case-insensitive path collisions detected:"
            echo "$collisions"
            exit 1
          fi

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

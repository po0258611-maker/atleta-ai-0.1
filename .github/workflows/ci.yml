name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: gen-lang-client-0402109874
      FIRESTORE_ALLOW_MEMORY_FALLBACK: false
      PAYMENT_MODE: mock
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Detect case-insensitive path collisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          seen = {}
          collisions = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              key = str(p).lower()
              if key in seen and seen[key] != str(p):
                  collisions.append((seen[key], str(p)))
              else:
                  seen[key] = str(p)
          if collisions:
              print('Case-insensitive path collisions found:')
              for a, b in collisions:
                  print(f'- {a} <-> {b}')
              raise SystemExit(1)
          PY

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

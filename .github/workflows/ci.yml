name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: storied-cable-xn50x
      FIRESTORE_ALLOW_MEMORY_FALLBACK: false
      PAYMENT_MODE: mock
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-save

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Tests
        run: bun run test
